<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="An answer_id flows to the journal and the ledger; a later truth is scored against the template version it was asked under in outcomes.ndjson; a second truth for one answer is refused with 409, a torn last line is truncated before the next write, and calibration is planned">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4493f8"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#161b22" stroke-width="1"/>
  </pattern>
</defs>

<rect width="1280" height="560" fill="url(#bg)"/>
<rect width="1280" height="560" fill="url(#grid)" opacity="0.5"/>
<rect width="1280" height="4" fill="url(#accent)"/>

<text x="60" y="42" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">The record</text>

<!-- answer_id node -->
<rect x="60" y="130" width="190" height="80" rx="10" fill="#141a23" stroke="#2dd4bf" stroke-width="1.6"/>
<text x="84" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" fill="#2dd4bf">answer_id</text>
<text x="84" y="186" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#69788b">one per answer or refusal</text>

<!-- connectors to journal and ledger -->
<line x1="250" y1="150" x2="330" y2="105" stroke="#283341" stroke-width="2"/>
<circle cx="250" cy="150" r="4" fill="#d29922"><animateMotion path="M 0 0 L 80 -45" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="4s" repeatCount="indefinite"/></circle>

<line x1="250" y1="190" x2="330" y2="235" stroke="#283341" stroke-width="2"/>
<circle cx="250" cy="190" r="4" fill="#4493f8"><animateMotion path="M 0 0 L 80 45" dur="4s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="4s" begin="0.3s" repeatCount="indefinite"/></circle>

<!-- journal -->
<rect x="330" y="60" width="400" height="90" rx="10" fill="#141a23" stroke="#d29922" stroke-width="1.4"/>
<text x="352" y="90" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf3">journal</text>
<text x="352" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#9aa7b8">agent-event v1.0, source typryx</text>
<text x="352" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#d29922">typed_answer / typed_unanswered / typed_refused</text>

<!-- ledger -->
<rect x="330" y="200" width="300" height="90" rx="10" fill="#141a23" stroke="#4493f8" stroke-width="1.4"/>
<text x="352" y="230" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf3">ledger</text>
<text x="352" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#9aa7b8">answers.ndjson, fsync per write</text>
<text x="352" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#4493f8">a torn tail is cut at Open</text>

<!-- connector ledger -> outcomes -->
<line x1="630" y1="245" x2="690" y2="245" stroke="#283341" stroke-width="2"/>
<path d="M 690 245 l -11 -6 l 0 12 z" fill="#8b7cf6"/>
<circle cx="630" cy="245" r="4" fill="#8b7cf6"><animate attributeName="cx" values="630;690" dur="4s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="4s" begin="0.6s" repeatCount="indefinite"/></circle>

<!-- truth input -->
<rect x="690" y="330" width="180" height="70" rx="10" fill="#141a23" stroke="#69788b" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="712" y="360" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#9aa7b8">a later truth</text>
<text x="712" y="380" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#69788b">a person, or verdryx</text>
<line x1="780" y1="330" x2="780" y2="292" stroke="#283341" stroke-width="2"/>
<circle cx="780" cy="330" r="4" fill="#69788b"><animate attributeName="cy" values="330;292" dur="4s" begin="0.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="4s" begin="0.9s" repeatCount="indefinite"/></circle>

<!-- outcomes.ndjson -->
<rect x="690" y="200" width="300" height="90" rx="10" fill="#141a23" stroke="#8b7cf6" stroke-width="1.4"/>
<text x="712" y="230" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf3">outcomes.ndjson</text>
<text x="712" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#9aa7b8">scored against the version</text>
<text x="712" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#9aa7b8">the answer was asked under</text>

<!-- two facts -->
<rect x="1030" y="60" width="190" height="90" rx="10" fill="#141a23" stroke="#f85149" stroke-width="1.4"/>
<text x="1052" y="88" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#f85149">409</text>
<text x="1052" y="108" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#9aa7b8">a second truth for one</text>
<text x="1052" y="124" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#9aa7b8">answer is refused</text>
<text x="1052" y="140" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#9aa7b8">even after a restart</text>

<rect x="1030" y="200" width="190" height="90" rx="10" fill="#141a23" stroke="#3fb950" stroke-width="1.4"/>
<text x="1052" y="228" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#3fb950">crash safe</text>
<text x="1052" y="248" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#9aa7b8">a torn last line is cut</text>
<text x="1052" y="264" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#9aa7b8">before reopening; the next</text>
<text x="1052" y="280" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#9aa7b8">write survives the restart</text>

<!-- calibration, muted -->
<rect x="330" y="330" width="300" height="90" rx="10" fill="#141a23" stroke="#69788b" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="352" y="360" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#9aa7b8">calibration</text>
<text x="352" y="382" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#69788b">Brier score, reliability bins</text>
<text x="352" y="400" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" fill="#69788b">planned (phase E)</text>

<line x1="60" y1="460" x2="1220" y2="460" stroke="#222b38"/>
<text x="640" y="492" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#69788b">Every answer and refusal reaches the record, unless the journal is switched off.</text>
</svg>
