<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="Of five fields in the state, only the one the template names travels to the backend; the other four are held back and counted, and the record keeps a hash of what was sent, never the state">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4493f8"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#161b22" stroke-width="1"/>
  </pattern>
</defs>

<rect width="1280" height="520" fill="url(#bg)"/>
<rect width="1280" height="520" fill="url(#grid)" opacity="0.5"/>
<rect width="1280" height="4" fill="url(#accent)"/>

<text x="640" y="42" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">What leaves the box</text>

<!-- state card -->
<rect x="60" y="80" width="300" height="320" rx="10" fill="#141a23" stroke="#283341" stroke-width="1.4"/>
<text x="82" y="112" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" letter-spacing="0.4" fill="#69788b">STATE THE CALLER SENT</text>

<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
  <rect x="82" y="130" width="256" height="42" rx="6" fill="#1b2331" stroke="#2dd4bf" stroke-width="1.4"/>
  <text x="98" y="156" fill="#e6edf3">prompt</text>
  <text x="322" y="156" text-anchor="end" fill="#2dd4bf">sent</text>

  <rect x="82" y="182" width="256" height="34" rx="6" fill="#171d27" opacity="0.7">
    <animate attributeName="opacity" values="0.9;0.35;0.9" dur="4s" begin="0.2s" repeatCount="indefinite"/>
  </rect>
  <text x="98" y="204" fill="#69788b">task</text>

  <rect x="82" y="224" width="256" height="34" rx="6" fill="#171d27" opacity="0.7">
    <animate attributeName="opacity" values="0.9;0.35;0.9" dur="4s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <text x="98" y="246" fill="#69788b">user_email</text>

  <rect x="82" y="266" width="256" height="34" rx="6" fill="#171d27" opacity="0.7">
    <animate attributeName="opacity" values="0.9;0.35;0.9" dur="4s" begin="0.8s" repeatCount="indefinite"/>
  </rect>
  <text x="98" y="288" fill="#69788b">customer_iban</text>

  <rect x="82" y="308" width="256" height="34" rx="6" fill="#171d27" opacity="0.7">
    <animate attributeName="opacity" values="0.9;0.35;0.9" dur="4s" begin="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="98" y="330" fill="#69788b">internal_notes</text>
</g>
<text x="82" y="386" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#69788b">five fields, one named by the template</text>

<!-- template -->
<rect x="420" y="164" width="230" height="112" rx="10" fill="#141a23" stroke="#4493f8" stroke-width="1.4"/>
<text x="442" y="194" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf3">template</text>
<text x="442" y="216" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#4493f8">fields: ["prompt"]</text>
<text x="442" y="238" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#69788b">the allowlist, and the only one;</text>
<text x="442" y="254" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#69788b">nothing else is even readable</text>
<text x="442" y="270" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#69788b">outside internal/template</text>

<!-- connector state -> template -->
<line x1="360" y1="151" x2="418" y2="205" stroke="#283341" stroke-width="2"/>
<circle cx="360" cy="151" r="4" fill="#2dd4bf"><animateMotion path="M 0 0 L 58 54" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="4s" repeatCount="indefinite"/></circle>

<!-- connector template -> backend -->
<line x1="650" y1="220" x2="760" y2="220" stroke="#283341" stroke-width="2"/>
<path d="M 760 220 l -11 -6 l 0 12 z" fill="#2dd4bf"/>
<circle cx="650" cy="220" r="4" fill="#2dd4bf"><animate attributeName="cx" values="650;760" dur="4s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="4s" begin="0.3s" repeatCount="indefinite"/></circle>

<!-- backend -->
<rect x="760" y="164" width="210" height="112" rx="10" fill="#141a23" stroke="#2dd4bf" stroke-width="1.6"/>
<text x="782" y="196" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#e6edf3">backend</text>
<text x="782" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#2dd4bf">{"prompt": "..."}</text>
<text x="782" y="246" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#69788b">exactly one field, nothing</text>
<text x="782" y="262" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#69788b">it was not named to see</text>

<!-- held back counter -->
<rect x="420" y="316" width="230" height="84" rx="10" fill="#141a23" stroke="#f85149" stroke-width="1.4"/>
<text x="442" y="346" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" letter-spacing="0.4" fill="#69788b">HELD BACK</text>
<text x="442" y="374" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="700" fill="#f85149">4</text>
<text x="480" y="374" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#9aa7b8">task, user_email, customer_iban, internal_notes</text>

<!-- bottom strip -->
<line x1="60" y1="440" x2="1220" y2="440" stroke="#222b38"/>
<text x="640" y="470" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#e6edf3">The record keeps <tspan font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#4493f8">sha384(sent)</tspan>, never the state itself.</text>
<text x="640" y="494" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" fill="#69788b">measured 2026-09-25: customer_iban held back through the tokenfuse MCP broker, never reached the backend</text>
</svg>
