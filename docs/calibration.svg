<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="A reliability diagram: the diagonal is perfectly calibrated, and the measured bins for qwen2.5:3b and qwen2.5:7b both sit below it, meaning both models state more confidence than their measured accuracy earns">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4493f8"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#161b22" stroke-width="1"/>
  </pattern>
</defs>

<rect width="1280" height="640" fill="url(#bg)"/>
<rect width="1280" height="640" fill="url(#grid)" opacity="0.5"/>
<rect width="1280" height="4" fill="url(#accent)"/>

<text x="640" y="42" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Calibration: stated confidence vs. measured accuracy</text>
<text x="640" y="65" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" fill="#69788b">eval.outcome_met, openai-logprobs, Ollama 0.34.2, n=60, seed 1, measured 2026-09-25</text>

<!-- chart card -->
<rect x="40" y="96" width="800" height="500" rx="14" fill="#141a23" stroke="#283341" stroke-width="1.4"/>

<!-- plot axes: x0=100,x1=780 (confidence 0..1), y0=520,y1=150 (accuracy 0..1) -->
<line x1="100" y1="520" x2="780" y2="520" stroke="#283341" stroke-width="1.4"/>
<line x1="100" y1="520" x2="100" y2="150" stroke="#283341" stroke-width="1.4"/>

<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#69788b">
  <text x="100" y="538" text-anchor="middle">0</text>
  <text x="440" y="538" text-anchor="middle">.5</text>
  <text x="780" y="538" text-anchor="middle">1.0</text>
  <text x="88" y="524" text-anchor="end">0</text>
  <text x="88" y="339" text-anchor="end">.5</text>
  <text x="88" y="154" text-anchor="end">1.0</text>
</g>
<g stroke="#20293a" stroke-width="1">
  <line x1="440" y1="150" x2="440" y2="520"/>
  <line x1="100" y1="335" x2="780" y2="335"/>
</g>

<text x="440" y="565" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" fill="#9aa7b8">mean confidence (stated)</text>
<text x="62" y="335" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" fill="#9aa7b8" transform="rotate(-90 62 335)">accuracy (measured)</text>

<!-- perfectly calibrated diagonal -->
<line x1="100" y1="520" x2="780" y2="150" stroke="#3fb950" stroke-width="1.8" stroke-dasharray="6 5" opacity="0.85"/>
<text x="700" y="200" text-anchor="end" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#3fb950">perfectly calibrated</text>

<!-- qwen2.5:3b: one bin, n=60, conf=0.995, acc=0.500 -->
<circle cx="776.6" cy="335" r="8" fill="#1a212c" stroke="#ff6b63" stroke-width="2.4">
  <animate attributeName="r" values="8;10;8" dur="3s" repeatCount="indefinite"/>
</circle>
<text x="776.6" y="316" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#ff6b63">3b, n=60</text>

<!-- qwen2.5:7b: three bins with n&gt;=3 (a fourth bin, n=2, is omitted: too thin to plot honestly) -->
<circle cx="468.6" cy="150" r="6.5" fill="#1a212c" stroke="#e3b341" stroke-width="2.2"/>
<text x="468.6" y="136" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#e3b341">7b, n=3</text>

<circle cx="690.9" cy="427.5" r="7" fill="#1a212c" stroke="#e3b341" stroke-width="2.2"/>
<text x="690.9" y="446" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#e3b341">7b, n=4</text>

<circle cx="774.6" cy="257" r="10" fill="#1a212c" stroke="#e3b341" stroke-width="2.4">
  <animate attributeName="r" values="10;12;10" dur="3s" begin="0.4s" repeatCount="indefinite"/>
</circle>
<text x="734" y="257" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#e3b341">7b, n=48</text>

<!-- legend -->
<circle cx="120" cy="172" r="5.5" fill="#1a212c" stroke="#ff6b63" stroke-width="2"/>
<text x="134" y="176" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#9aa7b8">qwen2.5:3b, bins with n &#8805; 3</text>
<circle cx="330" cy="172" r="5.5" fill="#1a212c" stroke="#e3b341" stroke-width="2"/>
<text x="344" y="176" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#9aa7b8">qwen2.5:7b, bins with n &#8805; 3</text>

<!-- table card -->
<rect x="864" y="96" width="376" height="500" rx="14" fill="#141a23" stroke="#283341" stroke-width="1.4"/>
<text x="886" y="128" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#e6edf3">Per model, whole group</text>

<rect x="880" y="150" width="344" height="150" rx="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/>
<rect x="880" y="150" width="4" height="150" rx="2" fill="#ff6b63"/>
<text x="900" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" fill="#e6edf3">qwen2.5:3b</text>
<text x="900" y="194" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#69788b">n=60 answered of 60 asked</text>
<text x="900" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#9aa7b8">accuracy</text>
<text x="1204" y="220" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#e6edf3">0.500</text>
<text x="900" y="242" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#9aa7b8">mean confidence</text>
<text x="1204" y="242" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#ff6b63">0.995</text>
<text x="900" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#9aa7b8">ECE</text>
<text x="1204" y="264" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#ff6b63">0.495</text>
<text x="900" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#9aa7b8">Brier</text>
<text x="1204" y="286" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#e6edf3">0.987</text>

<rect x="880" y="320" width="344" height="150" rx="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/>
<rect x="880" y="320" width="4" height="150" rx="2" fill="#e3b341"/>
<text x="900" y="346" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" fill="#e6edf3">qwen2.5:7b</text>
<text x="900" y="364" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#69788b">n=57 answered of 60 asked</text>
<text x="900" y="390" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#9aa7b8">accuracy</text>
<text x="1204" y="390" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#e6edf3">0.702</text>
<text x="900" y="412" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#9aa7b8">mean confidence</text>
<text x="1204" y="412" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#e3b341">0.948</text>
<text x="900" y="434" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#9aa7b8">ECE</text>
<text x="1204" y="434" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#e3b341">0.318</text>
<text x="900" y="456" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#9aa7b8">Brier</text>
<text x="1204" y="456" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#e6edf3">0.595</text>

<text x="886" y="500" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#69788b">stub omitted: deterministic</text>
<text x="886" y="516" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#69788b">and free by construction,</text>
<text x="886" y="532" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#69788b">a baseline only (see README).</text>

<text x="1252" y="622" font-size="12.5" fill="#69788b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="end">github.com/TAIPANBOX/typryx</text>
</svg>
